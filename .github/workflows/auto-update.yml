name: Auto-update Formulas and Casks

on:
  schedule:
    - cron: '17 10 * * *'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula or cask to update (leave empty for all)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-formulas:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - formula: apple-contacts-cli
            repo: karbassi/apple-contacts-cli
            asset_prefix: apple-contacts-cli
            universal: true
          - formula: apple-voice-memos-cli
            repo: karbassi/apple-voice-memos-cli
            asset_prefix: apple-voice-memos-cli
            universal: true
          - formula: cc-statusline
            repo: karbassi/cc-status-line
            asset_prefix: cc-statusline
          - formula: git-hist
            repo: karbassi/git-hist
            asset_prefix: git-hist
          - formula: loom
            repo: karbassi/loom-api
            asset_prefix: loom
          - formula: ticktick-cli
            repo: karbassi/ticktick-cli
            asset_prefix: ticktick-cli
    steps:
      - name: Check if this formula should run
        id: should_run
        run: |
          REQUESTED="${{ github.event.client_payload.formula || inputs.formula }}"
          CURRENT="${{ matrix.formula }}"
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "$CURRENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $CURRENT (requested: $REQUESTED)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.should_run.outputs.run == 'true'

      - name: Check for updates
        if: steps.should_run.outputs.run == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FORMULA="Formula/${{ matrix.formula }}.rb"
          REPO="${{ matrix.repo }}"

          CURRENT=$(grep -E '^\s*version\s+"' "$FORMULA" | sed 's/.*"\(.*\)".*/\1/')
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' | sed 's/^v//')

          echo "Current: $CURRENT → Latest: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already up to date"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against downgrades: releases/latest can resolve to an older
          # stable when the current pin is a prerelease (e.g. an rc tag).
          if ! CURRENT="$CURRENT" LATEST="$LATEST" ruby -e 'begin; exit(Gem::Version.new(ENV["LATEST"]) > Gem::Version.new(ENV["CURRENT"]) ? 0 : 1); rescue; exit 1; end'; then
            echo "Latest ($LATEST) is not newer than current ($CURRENT); skipping"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256 digests
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ matrix.repo }}"
          PREFIX="${{ matrix.asset_prefix }}"
          UNIVERSAL="${{ matrix.universal }}"

          ASSETS=$(gh api "repos/$REPO/releases/latest" --jq '.assets[] | "\(.name) \(.digest // "")"')

          get_sha() {
            local pattern="$1"
            local sha=$(echo "$ASSETS" | grep -E "^${pattern}\.(tar\.gz|zip) " | head -1 | awk '{print $2}' | sed 's/sha256://')
            if [ -z "$sha" ] || [ ${#sha} -ne 64 ]; then
              echo "::error::No valid SHA256 for pattern: $pattern"
              exit 1
            fi
            echo "$sha"
          }

          if [ "$UNIVERSAL" = "true" ]; then
            SHA=$(get_sha "${PREFIX}-v[^-]+-macos-universal")
            echo "universal=$SHA" >> "$GITHUB_OUTPUT"
            echo "Universal: $SHA"
          else
            for platform in macos-arm64 macos-x86_64 linux-arm64 linux-x86_64; do
              KEY=$(echo "$platform" | tr '-' '_')
              SHA=$(echo "$ASSETS" | grep -E "^${PREFIX}-${platform}\.(tar\.gz|zip) " | head -1 | awk '{print $2}' | sed 's/sha256://' || true)
              if [ -n "$SHA" ] && [ ${#SHA} -eq 64 ]; then
                echo "${KEY}=$SHA" >> "$GITHUB_OUTPUT"
                echo "$platform: $SHA"
              fi
            done
          fi

      - name: Update formula
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: |
          set -e
          FORMULA="Formula/${{ matrix.formula }}.rb"
          CURRENT="${{ steps.check.outputs.current }}"
          LATEST="${{ steps.check.outputs.latest }}"
          UNIVERSAL="${{ matrix.universal }}"

          # NOTE: runner is macOS (BSD sed); -i requires an explicit (empty)
          # backup suffix arg, else the filename is parsed as the script.
          sed -i '' "s/version \"$CURRENT\"/version \"$LATEST\"/" "$FORMULA"

          if [ "$UNIVERSAL" = "true" ]; then
            sed -i '' "s/sha256 \"[a-fA-F0-9]\{64\}\"/sha256 \"${{ steps.sha.outputs.universal }}\"/" "$FORMULA"
          else
          ruby <<'RUBY'
          formula = ENV.fetch("FORMULA")
          shas = {
            macos: { arm: ENV["MACOS_ARM64"], intel: ENV["MACOS_X86_64"] },
            linux: { arm: ENV["LINUX_ARM64"], intel: ENV["LINUX_X86_64"] }
          }

          lines = File.readlines(formula)
          stack = []

          lines.each_with_index do |line, i|
            stack.push(:macos) if line =~ /\bon_macos\b/
            stack.push(:linux) if line =~ /\bon_linux\b/
            stack.push(:arm)   if line =~ /\bon_arm\b/
            stack.push(:intel) if line =~ /\bon_intel\b/

            if line =~ /sha256\s+"([a-fA-F0-9]+|PLACEHOLDER)"/
              os   = stack.find { |c| %i[macos linux].include?(c) }
              arch = stack.find { |c| %i[arm intel].include?(c) }
              sha  = shas.dig(os, arch)
              lines[i] = line.sub(/sha256\s+"[^"]+"/, %(sha256 "#{sha}")) if sha&.match?(/\A[a-fA-F0-9]{64}\z/)
            end

            stack.pop if line.strip == "end" && !stack.empty?
          end

          File.write(formula, lines.join)
          RUBY
          fi

          echo "Updated $FORMULA"
          grep -E 'version|sha256' "$FORMULA"
        env:
          FORMULA: "Formula/${{ matrix.formula }}.rb"
          MACOS_ARM64: ${{ steps.sha.outputs.macos_arm64 }}
          MACOS_X86_64: ${{ steps.sha.outputs.macos_x86_64 }}
          LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}

      - name: Validate with brew style
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: brew style "Formula/${{ matrix.formula }}.rb"

      - name: Commit and push
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${{ matrix.formula }}.rb"
          git commit -m "${{ matrix.formula }} ${{ steps.check.outputs.latest }}"
          git pull --rebase origin main
          git push origin main

  update-casks:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cask: clearly
            repo: Shpigford/clearly
            asset: Clearly.dmg
          - cask: jerboa
            repo: karbassi/jerboa
            asset: Jerboa.zip
          - cask: debriddownloader
            repo: CasaVargas/DebridDownloader
            asset: DebridDownloader_{version}_aarch64.dmg
    steps:
      - name: Check if this cask should run
        id: should_run
        run: |
          REQUESTED="${{ github.event.client_payload.cask || inputs.formula }}"
          CURRENT="${{ matrix.cask }}"
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "$CURRENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $CURRENT (requested: $REQUESTED)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.should_run.outputs.run == 'true'

      - name: Check for updates
        if: steps.should_run.outputs.run == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CASK="Casks/${{ matrix.cask }}.rb"
          REPO="${{ matrix.repo }}"

          CURRENT=$(grep -E '^\s*version\s+"' "$CASK" | sed 's/.*"\(.*\)".*/\1/')
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' | sed 's/^v//')

          echo "Current: $CURRENT → Latest: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already up to date"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against downgrades: releases/latest can resolve to an older
          # stable when the current pin is a prerelease (e.g. a beta tag).
          if ! CURRENT="$CURRENT" LATEST="$LATEST" ruby -e 'begin; exit(Gem::Version.new(ENV["LATEST"]) > Gem::Version.new(ENV["CURRENT"]) ? 0 : 1); rescue; exit 1; end'; then
            echo "Latest ($LATEST) is not newer than current ($CURRENT); skipping"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSET_NAME=$(echo "${{ matrix.asset }}" | sed "s/{version}/$LATEST/g")
          SHA=$(gh api "repos/$REPO/releases/latest" --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest" | sed 's/sha256://')
          if [ -z "$SHA" ] || [ ${#SHA} -ne 64 ]; then
            echo "::error::Invalid SHA256 for '$ASSET_NAME': '$SHA'"
            exit 1
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update cask
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: |
          CASK="Casks/${{ matrix.cask }}.rb"
          # NOTE: macOS (BSD) sed needs an explicit empty backup suffix after -i.
          sed -i '' "s/version \".*\"/version \"${{ steps.check.outputs.latest }}\"/" "$CASK"
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.check.outputs.sha }}\"/" "$CASK"

      - name: Validate with brew style
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: brew style "Casks/${{ matrix.cask }}.rb"

      - name: Commit and push
        if: steps.should_run.outputs.run == 'true' && steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ matrix.cask }}.rb"
          git commit -m "${{ matrix.cask }} ${{ steps.check.outputs.latest }}"
          git pull --rebase origin main
          git push origin main
